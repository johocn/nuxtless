<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>订单列表 · mall 版式</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#e9ebef}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#1f2937;-webkit-font-smoothing:antialiased}
  .stage{width:390px;margin:0 auto;background:#f6f7f9;min-height:100vh;padding-bottom:26px}
  .label{width:390px;margin:0 auto;padding:10px 12px;font-size:12px;color:#6b7280;background:#e9ebef}
  .label b{color:#e0433f}

  /* usemall：顶部标题卡 */
  .headcard{position:sticky;top:0;z-index:20;background:#fff;border-radius:0 0 18px 18px;padding:14px 16px 12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .headcard h1{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:800;margin:0}
  .headcard h1 .bar{width:5px;height:19px;border-radius:3px;background:#e0433f}
  .headcard p{margin:5px 0 0 13px;font-size:12px;color:#9ca3af}

  .tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;font-size:13px;padding:6px 15px;border-radius:999px;background:#fff;color:#6b7280;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .tab.on{background:linear-gradient(90deg,#e0433f,#ff6a6c);color:#fff;font-weight:700}

  .list{padding:12px 14px 4px;display:flex;flex-direction:column;gap:14px}
  .card{background:#fff;border-radius:18px;padding:14px 15px 12px;box-shadow:0 3px 14px rgba(17,24,39,.06)}
  .chead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .chead .shop{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700}
  .chead .dot{color:#e0433f;font-size:14px}
  .pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px}
  .p-warn{color:#b45309;background:#fff4e5}
  .p-info{color:#c2410c;background:#fff0ec}
  .p-ok{color:#047857;background:#e9f9f0}
  .p-mute{color:#6b7280;background:#f3f4f6}

  .items{margin-top:6px}
  .item{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid #f5f5f6}
  .item:first-child{border-top:0}
  .thumb{width:50px;height:50px;border-radius:12px;background:linear-gradient(135deg,#f2f3f5,#e8eaee);flex:none;display:flex;align-items:center;justify-content:center;color:#b9bfc9;font-size:18px}
  .meta{flex:1;min-width:0}
  .meta .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .sp{font-size:11px;color:#9ca3af;margin-top:3px}
  .price{font-size:13px;font-weight:700;white-space:nowrap}
  .price .q{color:#9ca3af;font-weight:400;margin-left:3px;font-size:11.5px}

  .cfoot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:10px;border-top:1px dashed #eef0f2;font-size:12.5px;color:#6b7280}
  .cfoot .paid b{color:#e0433f;font-size:15px}
  .acts{display:flex;justify-content:flex-end;gap:9px;margin-top:11px}
  .btn{font-size:12.5px;padding:7px 16px;border-radius:999px;border:1px solid transparent;font-family:inherit}
  .btn-soft{background:#f5f6f8;color:#4b5563}
  .btn-softp{background:#fff0ec;color:#e0433f;font-weight:600}
  .btn-pri{background:linear-gradient(90deg,#e0433f,#ff6a6c);color:#fff;font-weight:700;box-shadow:0 3px 10px rgba(224,67,63,.28)}

  .more{margin:16px 14px 0;text-align:center}
  .more button{font-size:13px;padding:9px 30px;border-radius:999px;border:0;background:#fff;color:#6b7280;box-shadow:0 2px 8px rgba(0,0,0,.05);font-family:inherit}
</style>
</head>
<body>
<div class="label">版式 <b>mall</b>（usemall 珊瑚粉 · 大圆角白卡 + 渐变 CTA）／页面：订单列表</div>
<div class="stage">
  <div class="headcard">
    <h1><span class="bar"></span>我的订单</h1>
    <p>查看订单状态与物流进度</p>
  </div>

  <div class="tabs">
    <span class="tab on">全部</span>
    <span class="tab">待支付</span>
    <span class="tab">待发货</span>
    <span class="tab">待收货</span>
    <span class="tab">已完成</span>
    <span class="tab">已取消</span>
  </div>

  <div class="list">
    <div class="card">
      <div class="chead">
        <div class="shop"><span class="dot">🏬</span>自营</div>
        <span class="pill p-warn">待支付</span>
      </div>
      <div class="items">
        <div class="item">
          <div class="thumb">▤</div>
          <div class="meta"><div class="nm">无线蓝牙耳机 Pro</div><div class="sp">黑色 · 128G</div></div>
          <div class="price">¥796.00<span class="q">×2</span></div>
        </div>
        <div class="item">
          <div class="thumb">▤</div>
          <div class="meta"><div class="nm">移动电源 10000mAh</div><div class="sp">白色</div></div>
          <div class="price">¥99.00<span class="q">×1</span></div>
        </div>
      </div>
      <div class="cfoot">
        <span>共 3 件</span>
        <span class="paid">实付 <b>¥895.00</b></span>
      </div>
      <div class="acts">
        <button class="btn btn-soft">取消订单</button>
        <button class="btn btn-pri">去支付</button>
      </div>
    </div>

    <div class="card">
      <div class="chead">
        <div class="shop"><span class="dot">🏬</span>自提 / 核销信息</div>
        <span class="pill p-info">待收货</span>
      </div>
      <div class="items">
        <div class="item">
          <div class="thumb">▤</div>
          <div class="meta"><div class="nm">保温杯 500ml</div><div class="sp">蓝色</div></div>
          <div class="price">¥59.00<span class="q">×1</span></div>
        </div>
      </div>
      <div class="cfoot">
        <span>共 1 件</span>
        <span class="paid">实付 <b>¥59.00</b></span>
      </div>
      <div class="acts">
        <button class="btn btn-softp">再次购买</button>
        <button class="btn btn-pri">查看详情</button>
      </div>
    </div>

    <div class="card">
      <div class="chead">
        <div class="shop"><span class="dot">🏬</span>自营</div>
        <span class="pill p-ok">已完成</span>
      </div>
      <div class="items">
        <div class="item">
          <div class="thumb">▤</div>
          <div class="meta"><div class="nm">纯棉基础款 T 恤</div><div class="sp">白色 · L</div></div>
          <div class="price">¥129.00<span class="q">×1</span></div>
        </div>
      </div>
      <div class="cfoot">
        <span>共 1 件</span>
        <span class="paid">实付 <b>¥129.00</b></span>
      </div>
      <div class="acts">
        <button class="btn btn-softp">再次购买</button>
        <button class="btn btn-pri">查看详情</button>
      </div>
    </div>
  </div>

  <div class="more"><button>加载更多</button></div>
</div>
</body>
</html>
