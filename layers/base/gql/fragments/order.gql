fragment OrderBase on Order {
  id
  code
  type
  couponCodes
  state
  totalQuantity
  totalWithTax
  currencyCode
  customer {
    id
    firstName
    lastName
    emailAddress
  }
  lines {
    id
    unitPriceWithTax
    quantity
    linePriceWithTax
    productVariant {
      id
      name
      product {
        id
        name
        slug
      }
    }
    featuredAsset {
      id
      preview
    }
    customFields {
      hotelCheckIn
      hotelCheckOut
      hotelNights
    }
  }
  customFields {
    lat
    lng
    city
    deliveryType
  }
}

fragment OrderDetail on Order {
  id
  code
  couponCodes
  state
  currencyCode
  totalQuantity
  subTotal
  shippingWithTax
  totalWithTax
  orderPlacedAt
  customer {
    id
    firstName
    lastName
    emailAddress
  }
  shippingAddress {
    fullName
    streetLine1
    streetLine2
    city
    postalCode
    country
  }
  billingAddress {
    fullName
    streetLine1
    streetLine2
    city
    postalCode
    country
  }
  discounts {
    description
    amountWithTax
  }
  lines {
    id
    unitPriceWithTax
    quantity
    linePriceWithTax
    proratedLinePrice
    productVariant {
      id
      name
      sku
      product {
        id
        name
        slug
      }
    }
    featuredAsset {
      id
      preview
    }
    customFields {
      hotelCheckIn
      hotelCheckOut
      hotelNights
    }
  }
  payments {
    method
  }
  # shippingLines 故意不查：ShippingLine.shippingMethod 在 schema 为非空，
  # 历史订单的配送方式被后台删除后会悬空（resolver 返回 null）→ 整个查询
  # 报 "Cannot return null for non-nullable field ShippingLine.shippingMethod"
  # → 订单详情/列表一律 404（2026-10-12 线上事故）。前端展示处本就
  # null-safe（DeliveryInfo / OrderMetaCard 可选链 + 兜底文案），移除该
  # 子查询后悬空单自然回退兜底，不影响其余字段。
  taxSummary {
    description
    taxTotal
  }
  fulfillments {
    id
    state
    method
  }
  customFields {
    lat
    lng
    city
    deliveryType
    selectedPickupLocationId {
      id
      name
      type
      address
      phoneNumber
      businessHours
    }
    pickupType
    pickupClaimed
    collected
    paymentType
    packageShippingJson
    shippingAdjustment
    contactName
    contactPhone
    remark
  }
}
