# Queries
query GetActiveOrder {
  activeOrder {
    ...OrderBase
  }
}

query GetActiveOrderDetail {
  activeOrder {
    ...OrderDetail
  }
}

query GetShippingMethods {
  eligibleShippingMethods {
    id
    price
    name
    code
    description
  }
}

query GetPaymentMethods {
  eligiblePaymentMethods {
    id
    name
    code
    isEligible
  }
}

query GetOrderByCode($code: String!) {
  orderByCode(code: $code) {
    ...OrderDetail
  }
}

query GetOrderHistory($options: OrderListOptions) {
  activeCustomer {
    orders(options: $options) {
      totalItems
      items {
        ...OrderBase
        orderPlacedAt
      }
    }
  }
}

# Mutations
mutation AddItemToOrder($variantId: ID!, $quantity: Int!) {
  addItemToOrder(productVariantId: $variantId, quantity: $quantity) {
    __typename
    ...OrderBase
    ... on ErrorResult {
      errorCode
      message
    }
    ... on InsufficientStockError {
      quantityAvailable
      order {
        ...OrderBase
      }
    }
  }
}

mutation RemoveItemFromOrder($orderLineId: ID!) {
  removeOrderLine(orderLineId: $orderLineId) {
    __typename
    ...OrderBase
    ... on ErrorResult {
      errorCode
      message
    }
  }
}

mutation AdjustOrderLine($orderLineId: ID!, $quantity: Int!) {
  adjustOrderLine(orderLineId: $orderLineId, quantity: $quantity) {
    __typename
    ...OrderBase
    ... on ErrorResult {
      errorCode
      message
    }
  }
}

mutation ApplyCouponCode($couponCode: String!) {
  applyCouponCode(couponCode: $couponCode) {
    __typename
    ...OrderBase
    ... on ErrorResult {
      errorCode
      message
    }
  }
}

mutation RemoveCouponCode($couponCode: String!) {
  removeCouponCode(couponCode: $couponCode) {
    __typename
    ...OrderBase
  }
}

mutation SetCustomerForOrder($input: CreateCustomerInput!) {
  setCustomerForOrder(input: $input) {
    __typename
    ...OrderDetail
    ... on ErrorResult {
      errorCode
      message
    }
  }
}

mutation SetOrderShippingAddress($input: CreateAddressInput!) {
  setOrderShippingAddress(input: $input) {
    __typename
    ...OrderDetail
    ... on ErrorResult {
      errorCode
      message
    }
  }
}

mutation SetShippingMethod($id: [ID!]!) {
  setOrderShippingMethod(shippingMethodId: $id) {
    __typename
    ...OrderDetail
    ... on ErrorResult {
      errorCode
      message
    }
  }
}

mutation TransitionToState($state: String!) {
  transitionOrderToState(state: $state) {
    __typename
    ...OrderDetail
    ... on OrderStateTransitionError {
      errorCode
      message
      transitionError
      fromState
      toState
    }
  }
}

mutation AddPaymentToOrder($input: PaymentInput!) {
  addPaymentToOrder(input: $input) {
    __typename
    ...OrderDetail
    ... on ErrorResult {
      errorCode
      message
    }
  }
}

mutation SetOrderCustomFields($input: UpdateOrderInput!) {
  setOrderCustomFields(input: $input) {
    __typename
    ...OrderDetail
    ... on ErrorResult {
      errorCode
      message
    }
  }
}

# ===== 按配送档案分箱 + 支付拆合（后端 cjk-plugin）=====

query GetOrderBoxes {
  orderBoxes {
    boxKey
    profileId
    profileName
    lineIds
    tenantChannelId
    shippingProfileIds
    availableShippingMethodIds
    availableShippingMethods {
      id
      code
      name
    }
    defaultShippingMethodId
    requiresAddress
    requiresContact
    type
    availablePaymentMethodCodes
    loginRequiredPaymentCodes
    pickupLocations {
      id
      name
      type
      address
      phoneNumber
      businessHours
      coordinates
    }
    tenantName
    lines {
      orderLineId
      productVariantId
      productName
      unitPrice
      quantity
      lineTotal
      featureAssetSource
      variantName
      sku
    }
    availableCoupons {
      code
      name
      condition
      amount
    }
    shippingCost
    shippingDiscount
    subtotal
  }
}

# 每商户（租户）分账汇总：含税实收口径，供结算页分账汇总展示
query GetOrderMerchantSplit {
  orderMerchantSplit {
    tenantChannelId
    tenantName
    amount
  }
}

mutation SetOrderBoxShippingMethod($boxKey: String!, $shippingMethodId: ID!, $pickupLocationId: ID) {
  setOrderBoxShippingMethod(
    boxKey: $boxKey
    shippingMethodId: $shippingMethodId
    pickupLocationId: $pickupLocationId
  ) {
    __typename
    ...OrderDetail
  }
}

# boxKeys/lineIds 一律用 [String!]（boxKey 是非数字复合串 box:<profileId>，绝不能用 ID，
# 否则 Vendure 会把 ID 标量强转为整数导致匹配不上）；未传=结算全部箱与行。
mutation CheckoutSplitted($method: String!, $metadata: String, $boxKeys: [String!], $lineIds: [String!]) {
  checkoutSplitted(method: $method, metadata: $metadata, boxKeys: $boxKeys, lineIds: $lineIds) {
    __typename
    ...OrderDetail
  }
}
