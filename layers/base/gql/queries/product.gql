query GetProduct($id: ID!) {
  product(id: $id) {
    ...ProductBaseFragment
  }
}

query GetProductDetail($slug: String!) {
  product(slug: $slug) {
    ...ProductDetailFragment
  }
}

query GetProductVariantStock($productId: ID!, $variantId: String!) {
  product(id: $productId) {
    variantList(options: { filter: { id: { eq: $variantId } } }) {
      items {
        stockLevel
      }
    }
  }
}

query GetProducts($take: Int = 12, $skip: Int = 0) {
  products(options: { take: $take, skip: $skip }) {
    items {
      ...ProductBaseFragment
    }
    totalItems
  }
}

query SearchProducts(
  $term: String!
  $skip: Int
  $take: Int
  $collectionSlug: String
  $facetValueFilters: [FacetValueFilterInput!]
) {
  search(
    input: {
      term: $term
      groupByProduct: true
      skip: $skip
      take: $take
      collectionSlug: $collectionSlug
      facetValueFilters: $facetValueFilters
    }
  ) {
    totalItems
    items {
      ...ProductSearchFragment
    }
  }
}

query GetProductsByIds($ids: [String!]) {
  products(options: { filter: { id: { in: $ids } } }) {
    items {
      ...ProductBaseFragment
    }
  }
}

# 装修积木「推荐商品」按 slug 直取（source='slugs'）：一次请求返回商品主数据 +
# 变体含税价 / listPrice，供 useCuratedGoods 组装商品卡（SearchItem 无 customFields）。
query GetProductsBySlugs($slugs: [String!]) {
  products(options: { filter: { slug: { in: $slugs } } }) {
    items {
      id
      name
      slug
      featuredAsset {
        id
        preview
      }
      variants {
        currencyCode
        price
        priceWithTax
        customFields {
          listPrice
        }
      }
      customFields {
        belongCity
        serviceCities
        deliveryMethods
      }
    }
  }
}

query VariantNearbyStock(
  $productId: ID!
  $variantId: ID
  $lat: Float
  $lng: Float
  $city: String
) {
  variantNearbyStock(
    productId: $productId
    variantId: $variantId
    lat: $lat
    lng: $lng
    city: $city
  ) {
    distanceKm
    location {
      id
      name
      description
      lat
      lng
      serviceCities
    }
    variants {
      variantId
      variantName
      sku
      stockOnHand
      stockAllocated
      stockAvailable
    }
  }
}

query VariantStockInfo($variantId: ID!, $lat: Float, $lng: Float, $city: String, $deliveryMethod: String) {
  variantStockInfo(variantId: $variantId, lat: $lat, lng: $lng, city: $city, deliveryMethod: $deliveryMethod) {
    variantId
    saleableStock
    physicalStockEnabled
    stockDetail {
      locationId
      name
      lat
      lng
      onHand
      distanceKm
    }
  }
}
