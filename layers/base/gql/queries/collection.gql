query GetMenuCollections {
  collections(options: { topLevelOnly: true }) {
    items {
      ...CollectionMenuFragment
    }
  }
}

query GetCollection($slug: String!) {
  collection(slug: $slug) {
    ...CollectionBaseFragment
  }
}

query GetCollectionProducts($slug: String!, $skip: Int, $take: Int, $sort: SearchResultSortParameter, $facetValueFilters: [FacetValueFilterInput!]) {
  search(
    input: {
      collectionSlug: $slug
      groupByProduct: true
      skip: $skip
      take: $take
      sort: $sort
      facetValueFilters: $facetValueFilters
    }
  ) {
    totalItems
    items {
      ...ProductSearchFragment
    }
  }
}
