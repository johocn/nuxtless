query GetChannelCountries {
  activeChannel {
    defaultShippingZone {
      id
      name
      members {
        id
        code
        name
      }
    }
  }
}

query GetChannelTheme {
  activeChannel {
    customFields {
      themeId
      templateId
      shopContent
      detailConfig
      orderDetailConfig
      orderListConfig
      taxMode
      promoSchemes
      serviceSchemes
      shareImageUrl
      shopName
      shopIntro
    }
    pricesIncludeTax
  }
}
