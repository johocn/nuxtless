# ===== 限流 zone（http 上下文，本文件被 include 进 http{}）=====
# 注：/shop-api 的 rate limit 已回滚：站点 SSR 从 127.0.0.1 回源，与公网用户共用计数桶会被误伤
# （实测 node 请求出现 429）。若确需按 operation/来源分流，应改用 OpenResty Lua 或 @vendure/harden 再评估。
# /_og 冷渲染：签名 URL 已由 Nuxt strict 强制，这里再压一层频率（SSR 不调用该端点）
limit_req_zone  $binary_remote_addr zone=og_img:10m rate=10r/m;

# ===== youshop.cn 裸域 301 重定向到 https://www.youshop.cn（证书 SAN 已包含 youshop.cn）=====
server {
    listen 80 ;
    listen [::]:80 ;
    server_name youshop.cn;
    access_log /www/sites/www.youshop.cn/log/access_80.log main;
    error_log /www/sites/www.youshop.cn/log/error_80.log;
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }
    location / {
        return 301 https://www.youshop.cn$request_uri;
    }
}
server {
    listen 443 ssl http2 ;
    listen [::]:443 ssl http2 ;
    server_name youshop.cn;
    ssl_certificate /www/sites/www.youshop.cn/ssl/www.youshop.cn.pem;
    ssl_certificate_key /www/sites/www.youshop.cn/ssl/www.youshop.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    access_log /www/sites/www.youshop.cn/log/access_ssl.log main;
    error_log /www/sites/www.youshop.cn/log/error_ssl.log;
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }
    location / {
        return 301 https://www.youshop.cn$request_uri;
    }
}# www.youshop.cn — nshop(Nuxt SSR) 前端 https 反代到 127.0.0.1:3000
# 说明：SSR node-server 监听 3000，GQL_HOST 已改 https。80 端口仅证书验证 + 全站(含/shop-api)301 跳转 https；443 承载业务。
# 站点规则根 /www/sites/<域名>/（nginx 容器内规则路径），证书采用下载包原始文件名 www.youshop.cn.pem / www.youshop.cn.key。
# 80端口：仅证书验证 + 全部HTTP强制301跳转HTTPS
server {
    listen 80 ;
    listen [::]:80 ;
    server_name www.youshop.cn;
    access_log /www/sites/www.youshop.cn/log/access_80.log main;
    error_log /www/sites/www.youshop.cn/log/error_80.log;
    # SSL证书自动续期验证目录
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }
    # 所有http页面请求永久跳转https
    location / {
        return 301 https://$host$request_uri;
    }
    root /www/sites/www.youshop.cn/index;
}
# 443 HTTPS 主服务段
server {
    listen 443 ssl http2 ;
    listen [::]:443 ssl http2 ;
    server_name www.youshop.cn;
    # 证书采用下载包原始文件名，与上传文件保持一致
    ssl_certificate /www/sites/www.youshop.cn/ssl/www.youshop.cn.pem;
    ssl_certificate_key /www/sites/www.youshop.cn/ssl/www.youshop.cn.key;
    # SSL安全套件
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    index index.html index.htm;
    root /www/sites/www.youshop.cn/index;
    # 全局统一代理头
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_redirect off;
    access_log /www/sites/www.youshop.cn/log/access_ssl.log main;
    error_log /www/sites/www.youshop.cn/log/error_ssl.log;
    # 限流/连接数超限统一返回 429（nginx 原生默认返回 503）
    limit_req_status 429;
    # SSL证书自动续期验证目录
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }
    # 商品图片：Vendure asset 服务器（与 /shop-api 同端口 3020）。
    # 若不单独反代，/assets 会落到下方 location / → nshop:3000 → 404。
    location /assets {
        proxy_pass http://127.0.0.1:3020/assets;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 屏蔽 Vendure(Express) 动态代理指纹，让 og:image 图片表现如纯静态文件
        proxy_hide_header X-Powered-By;
        proxy_hide_header Vary;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Content-Security-Policy;
        # 安全响应头：禁止 MIME 嗅探、按内联资源返回、禁止被外站 frame；
        # CSP sandbox 让误传的 SVG/HTML 也无法执行脚本（因此 SVG 不进 403 正则）
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "inline" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
        # 可执行/可渲染脚本类上传资源一律拒绝（保留 svg：站点在 /assets 之外的 logo 使用 SVG，且被 CSP sandbox 兜底）
        location ~* \.(html?|xhtml|js|mjs|php|sh|bat|ps1|exe)$ {
            return 403;
        }
    }
    # 分享卡静态图直供（nitro 编译期静态清单不含部署后新增文件，运行时新增图 404 → nginx 直供 public/）
    location ~* ^/share-[a-z-]+\.(jpg|png|webp)$ {
        root /www/sites/www.youshop.cn/index/public;
        add_header Cache-Control "public, max-age=604800";
        # 带 w 参数（JS-SDK 缩略图 ?w=240&q=50）→ 内部跳缩放 location，原图请求不受影响
        if ($arg_w) { rewrite ^(.*)$ /_thumb$1 last; }
    }
    # 微信转发卡缩略图：宽 240 等比缩放（image_filter），q=50 固定
    location ^~ /_thumb/ {
        internal;
        alias /www/sites/www.youshop.cn/index/public/;
        image_filter resize 240 -;
        image_filter_jpeg_quality 50;
        image_filter_buffer 10M;
        add_header Cache-Control "public, max-age=86400";
    }

    # nshop SSR node-server 反代
    # MeiliSearch 统一知识库查询入口：/search-api/ -> 127.0.0.1:7700（仅本机回环，未暴露公网端口）
    location /search-api/ {
        proxy_pass http://127.0.0.1:7700/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_except GET POST { deny all; }
    }

    location /shop-api {
        proxy_pass http://127.0.0.1:3020/shop-api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        # 必须透传 $scheme，否则 Vendure 生成的 asset URL 用 http://，被 HTTPS 页面混合内容拦截
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
    }
    # OG 图片冷渲染：URL 必须带签名（Nuxt ogImage.security.strict），这里再限频防冷渲染刷 CPU
    location /_og {
        limit_req zone=og_img burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    # 站点根目录 SVG（logo/favicon）：禁止 MIME 嗅探，CSP sandbox 阻断 SVG 内联脚本
    location ~* ^/[a-z0-9-]+\.svg$ {
        proxy_pass http://127.0.0.1:3000;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        # 杜绝微信 webview 启发式缓存旧 SSR HTML（旧 index.html + 旧 _nuxt 包引用），强制每次回源
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    # Nuxt 构建产物 hash 文件名不可变，可长缓存 immutable（HTML 走上方 no-store，互不影响）
    location /_nuxt/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    error_page 404 /404.html;
}

